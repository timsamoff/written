<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Written by Tim Samoff</title>
    <meta name="description" content="A collection of stories, essays, poetry, articles, and how-tos.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Written by Tim Samoff">
    <meta property="og:description" content="A collection of stories, essays, poetry, articles, and how-tos.">
    <meta property="og:site_name" content="Written by Tim Samoff">
    <meta property="og:image" content="https://samoff.com/wbts_icon.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Written by Tim Samoff">
    <meta name="twitter:description" content="A collection of stories, essays, poetry, articles, and how-tos.">
    <meta name="twitter:image" content="https://samoff.com/wbts_icon.png">
    
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Code+Pro:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
    <script src="index.js" defer></script>
    <script src="filter-system.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <div class="branding-group">
                <img src="wbts_icon.png" alt="Written by Tim Samoff Logo" class="site-branding-icon">
                <div class="branding-text">
                    <a href="index.html" class="site-logo">Written by <span class="logo-amp">Tim</span> Samoff</a>
                    <span class="site-tagline">A collection of stories, essays, poetry, articles, and how-tos.</span>
                </div>
            </div>
            <div class="header-btn-group" role="group" aria-label="Site controls">
                <a href="mailto:samoff@gmail.com" class="header-circle-btn" id="contactBtn" aria-label="Contact Tim by email" title="Contact"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
                <button id="theme-toggle" class="header-circle-btn theme-btn" aria-label="Toggle theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container layout-wrapper-index">
        <!-- Filter Toggle Button -->
        <button id="filter-toggle" class="filter-toggle-btn">
            <i class="fa-solid fa-sliders-h"></i>
            <span>Filter by Genre & Theme</span>
            <i class="fa-solid fa-chevron-down filter-chevron"></i>
        </button>
        
        <!-- Collapsible Filter Section -->
        <div id="filter-section" class="filter-section collapsed">
            <div class="filter-group">
                <label class="filter-label">Genre</label>
                <div class="filter-buttons" id="genre-filters">
                    <button class="filter-chip active" data-filter="all">All</button>
                    <button class="filter-chip" data-filter="sci-fi">Sci-Fi</button>
                    <button class="filter-chip" data-filter="ya">YA</button>
                    <button class="filter-chip" data-filter="article">Article</button>
                    <button class="filter-chip" data-filter="poetry">Poetry</button>
                    <button class="filter-chip" data-filter="essay">Essay</button>
                    <button class="filter-chip" data-filter="guide">Guide</button>
                </div>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Theme</label>
                <div class="filter-buttons" id="theme-filters">
                    <button class="filter-chip active" data-filter="all">All</button>
                    <button class="filter-chip" data-filter="technology">Software Development</button>
                    <button class="filter-chip" data-filter="writing">Writing</button>
                    <button class="filter-chip" data-filter="post-apocalyptic">Post-Apocalyptic</button>
                    <button class="filter-chip" data-filter="publishing">Publishing</button>
                    <button class="filter-chip" data-filter="autobiographical">Autobiographical</button>
                </div>
            </div>
            
            <div class="filter-status">
                <span id="filter-count"></span>
                <button id="clear-filters" class="clear-btn">Clear All</button>
            </div>
        </div>
        
        <main class="toc-wrapper">
            <table class="toc-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Genres & Tags</th>
                    </tr>
                </thead>
                <tbody id="toc-body">
                    <!-- Dynamically generated by JavaScript -->
                </tbody>
            </table>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; <span id="current-year-index"></span> Written by Tim Samoff.</p>
            <script>
                document.getElementById('current-year-index').textContent = new Date().getFullYear();
            </script>
        </div>
    </footer>

    <script>
        // ==========================================================================
        // Dynamic Index - Loads projects from projects.json with Series Support
        // ==========================================================================

        document.addEventListener('DOMContentLoaded', function() {
            const tbody = document.getElementById('toc-body');
            
            // Fetch the projects data
            fetch('/data/projects.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Could not load projects.json');
                    }
                    return response.json();
                })
                .then(data => {
                    const projects = data.projects || [];
                    const series = data.series || [];
                    renderTable(projects, series);
                    setTimeout(() => {
                        reinitializeFilters();
                    }, 50);
                })
                .catch(error => {
                    console.error('Error loading projects:', error);
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">
                                <p>Could not load projects. Please make sure the server is running.</p>
                                <p style="font-size:0.8rem; margin-top:0.5rem;">Error: ${error.message}</p>
                            </td>
                        </tr>
                    `;
                });
        });

        function renderTable(projects, series) {
            const tbody = document.getElementById('toc-body');

            // Filter: only show published pieces
            const publishedProjects = projects.filter(p => p.published !== false);
            
            if (!publishedProjects || publishedProjects.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">
                            <p>No published pieces yet. Check back soon!</p>
                        </td>
                    </tr>
                `;
                return;
            }

            // Group by series
            const seriesMap = {};
            const standalone = [];
            
            publishedProjects.forEach(p => {
                if (p.series_id && series && series.some(s => s.id === p.series_id)) {
                    if (!seriesMap[p.series_id]) seriesMap[p.series_id] = [];
                    seriesMap[p.series_id].push(p);
                } else {
                    standalone.push(p);
                }
            });

            // Sort series by name
            const sortedSeriesIds = Object.keys(seriesMap).sort((a, b) => {
                const sa = series.find(s => s.id === a);
                const sb = series.find(s => s.id === b);
                return (sa ? sa.name : a).localeCompare(sb ? sb.name : b);
            });

            let html = '';
            let rowCount = 0;

            // Render series groups
            sortedSeriesIds.forEach(seriesId => {
                const s = series.find(s => s.id === seriesId);
                const groupItems = seriesMap[seriesId].sort((a, b) => {
                    if (a.part !== undefined && b.part !== undefined) return a.part - b.part;
                    return (a.order || 0) - (b.order || 0);
                });

                // Series header row
                html += `
                    <tr class="series-header-row">
                        <td colspan="3" class="series-header">
                            <span class="series-icon">📚</span>
                            <span class="series-name">${s ? escapeHtml(s.name) : escapeHtml(seriesId)}</span>
                            <span class="series-count">(${groupItems.length} part${groupItems.length !== 1 ? 's' : ''})</span>
                            ${s && s.description ? `<span class="series-description">— ${escapeHtml(s.description)}</span>` : ''}
                        </td>
                    </tr>
                `;

                groupItems.forEach(project => {
                    html += createRow(project, true);
                    rowCount++;
                });
            });

            // Render standalone
            if (standalone.length > 0) {
                html += `
                    <tr class="series-header-row">
                        <td colspan="3" class="series-header standalone-header">
                            <span class="series-icon">📄</span>
                            <span class="series-name">Standalone</span>
                            <span class="series-count">(${standalone.length} article${standalone.length !== 1 ? 's' : ''})</span>
                        </td>
                    </tr>
                `;
                standalone.forEach(project => {
                    html += createRow(project, false);
                    rowCount++;
                });
            }

            if (rowCount === 0) {
                html = `
                    <tr>
                        <td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">
                            <p>No published pieces yet. Check back soon!</p>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;
        }

        function createRow(project, isSeries) {
            const genres = project.genres || [];
            const themes = project.themes || [];
            const allTags = [...genres, ...themes];
            
            const pills = allTags.map(tag => 
                `<span class="pill">${escapeHtml(tag)}</span>`
            ).join('\n                                ');
            
            const dateDisplay = project.dateDisplay || formatDate(project.date);
            const fullPath = project.fullPath || `writing/${project.path}${project.slug}.html`;
            
            const partBadge = project.part 
                ? `<span class="part-badge">Part ${project.part}</span> `
                : '';
            
            return `
                <tr data-genres='${JSON.stringify(genres)}' data-themes='${JSON.stringify(themes)}' class="${isSeries ? 'series-article' : ''}">
                    <td class="toc-date">${dateDisplay}</td>
                    <td class="toc-title">
                        ${partBadge}
                        <a href="${fullPath}">${escapeHtml(project.title)}</a>
                    </td>
                    <td class="toc-tags">
                        <div class="pill-container">
                            ${pills}
                        </div>
                    </td>
                </tr>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        // ==========================================================================
        // Re-initialize Filters
        // ==========================================================================

        function reinitializeFilters() {
            const filterToggleBtn = document.getElementById('filter-toggle');
            const filterSection = document.getElementById('filter-section');
            const genreFilterContainer = document.getElementById('genre-filters');
            const themeFilterContainer = document.getElementById('theme-filters');
            const filterCountSpan = document.getElementById('filter-count');
            const clearFiltersBtn = document.getElementById('clear-filters');
            const tbody = document.getElementById('toc-body');
            
            const rows = Array.from(tbody.querySelectorAll('tr:not(.series-header-row)'));
            let activeGenres = new Set(['all']);
            let activeThemes = new Set(['all']);
            
            // Collapsible
            if (filterToggleBtn && filterSection) {
                filterSection.classList.add('collapsed');
                const newToggle = filterToggleBtn.cloneNode(true);
                filterToggleBtn.parentNode.replaceChild(newToggle, filterToggleBtn);
                newToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    const isCollapsed = filterSection.classList.contains('collapsed');
                    if (isCollapsed) {
                        filterSection.classList.remove('collapsed');
                        newToggle.classList.add('active');
                    } else {
                        filterSection.classList.add('collapsed');
                        newToggle.classList.remove('active');
                    }
                });
            }
            
            function matchesFilters(row) {
                const genres = JSON.parse(row.dataset.genres || '[]');
                const themes = JSON.parse(row.dataset.themes || '[]');
                let genreMatch = false;
                if (activeGenres.has('all')) {
                    genreMatch = true;
                } else {
                    for (let genre of activeGenres) {
                        if (genres.includes(genre)) {
                            genreMatch = true;
                            break;
                        }
                    }
                }
                let themeMatch = false;
                if (activeThemes.has('all')) {
                    themeMatch = true;
                } else {
                    for (let theme of activeThemes) {
                        if (themes.includes(theme)) {
                            themeMatch = true;
                            break;
                        }
                    }
                }
                return genreMatch && themeMatch;
            }
            
            function updateDisplay() {
                let visibleCount = 0;
                const allRows = tbody.querySelectorAll('tr');
                allRows.forEach(row => {
                    if (row.classList.contains('series-header-row')) {
                        // Check if any child rows are visible
                        let childVisible = false;
                        let next = row.nextElementSibling;
                        while (next && !next.classList.contains('series-header-row')) {
                            if (!next.classList.contains('filter-hidden')) {
                                childVisible = true;
                            }
                            next = next.nextElementSibling;
                        }
                        if (childVisible) {
                            row.classList.remove('filter-hidden');
                        } else {
                            row.classList.add('filter-hidden');
                        }
                        return;
                    }
                    
                    const isVisible = matchesFilters(row);
                    if (isVisible) {
                        row.classList.remove('filter-hidden');
                        visibleCount++;
                    } else {
                        row.classList.add('filter-hidden');
                    }
                });
                
                const totalCount = rows.length;
                if (visibleCount === totalCount && activeGenres.has('all') && activeThemes.has('all')) {
                    filterCountSpan.textContent = `Showing all ${totalCount} ${totalCount === 1 ? 'piece' : 'pieces'}`;
                } else {
                    filterCountSpan.textContent = `Showing ${visibleCount} of ${totalCount} ${totalCount === 1 ? 'piece' : 'pieces'}`;
                }
                
                const existingEmpty = document.querySelector('.no-results');
                if (existingEmpty) existingEmpty.remove();
                if (visibleCount === 0) {
                    const emptyMessage = document.createElement('tr');
                    emptyMessage.className = 'no-results';
                    emptyMessage.innerHTML = `
                        <td colspan="3">
                            <i class="fa-regular fa-folder-open"></i>
                            <p>No matching pieces found. Try adjusting your filters.</p>
                        </td>
                    `;
                    tbody.appendChild(emptyMessage);
                }
            }
            
            function handleFilterClick(button, type, value) {
                const isActive = button.classList.contains('active');
                const activeSet = type === 'genre' ? activeGenres : activeThemes;
                const container = type === 'genre' ? genreFilterContainer : themeFilterContainer;
                if (value === 'all') {
                    activeSet.clear();
                    activeSet.add('all');
                    const buttons = container.querySelectorAll('.filter-chip');
                    buttons.forEach(btn => {
                        if (btn.dataset.filter === 'all') {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                } else {
                    if (activeSet.has('all')) {
                        activeSet.delete('all');
                        const allButton = container.querySelector('.filter-chip[data-filter="all"]');
                        if (allButton) allButton.classList.remove('active');
                    }
                    if (isActive) {
                        activeSet.delete(value);
                        button.classList.remove('active');
                    } else {
                        activeSet.add(value);
                        button.classList.add('active');
                    }
                    if (activeSet.size === 0) {
                        activeSet.add('all');
                        const allButton = container.querySelector('.filter-chip[data-filter="all"]');
                        if (allButton) allButton.classList.add('active');
                    }
                }
                updateDisplay();
            }
            
            function clearAllFilters() {
                activeGenres.clear();
                activeGenres.add('all');
                activeThemes.clear();
                activeThemes.add('all');
                genreFilterContainer.querySelectorAll('.filter-chip').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === 'all');
                });
                themeFilterContainer.querySelectorAll('.filter-chip').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === 'all');
                });
                updateDisplay();
            }
            
            // Rebuild genre buttons
            const genreButtons = genreFilterContainer.querySelectorAll('.filter-chip');
            genreButtons.forEach(btn => {
                const clone = btn.cloneNode(true);
                btn.parentNode.replaceChild(clone, btn);
                clone.addEventListener('click', function() {
                    handleFilterClick(this, 'genre', this.dataset.filter);
                });
            });
            
            // Rebuild theme buttons
            const themeButtons = themeFilterContainer.querySelectorAll('.filter-chip');
            themeButtons.forEach(btn => {
                const clone = btn.cloneNode(true);
                btn.parentNode.replaceChild(clone, btn);
                clone.addEventListener('click', function() {
                    handleFilterClick(this, 'theme', this.dataset.filter);
                });
            });
            
            // Clear filters button
            if (clearFiltersBtn) {
                const clearClone = clearFiltersBtn.cloneNode(true);
                clearFiltersBtn.parentNode.replaceChild(clearClone, clearFiltersBtn);
                clearClone.addEventListener('click', clearAllFilters);
            }
            
            updateDisplay();
        }
    </script>

</body>
</html>
