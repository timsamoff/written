<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Written by Tim Samoff</title>
    
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Code+Pro:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
    <script src="filter.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <div class="branding-group">
                <img src="wbts_icon.png" alt="Written by Tim Samoff Logo" class="site-branding-icon">
                <div class="branding-text">
                    <a href="index.html" class="site-logo">Written by <span class="logo-amp">Tim</span> Samoff</a>
                    <span class="site-tagline">A collection of stories, essays, poetry, articles, and how-tos.</span>
                </div>
            </div>
            <div class="header-btn-group" role="group" aria-label="Site controls">
                <a href="mailto:samoff@gmail.com" class="header-circle-btn" id="contactBtn" aria-label="Contact Tim by email" title="Contact"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
                <button id="theme-toggle" class="header-circle-btn theme-btn" aria-label="Toggle theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container layout-wrapper-index">
        <!-- Filter Bar -->
        <div class="container layout-wrapper-index">
    <!-- Filter Toggle Button -->
    <button id="filter-toggle" class="filter-toggle-btn">
        <i class="fa-solid fa-sliders-h"></i>
        <span>Filter by Genre & Theme</span>
        <i class="fa-solid fa-chevron-down filter-chevron"></i>
    </button>
    
    <!-- Collapsible Filter Section -->
    <div id="filter-section" class="filter-section collapsed">
        <div class="filter-group">
            <label class="filter-label">Genre</label>
            <div class="filter-buttons" id="genre-filters">
                <button class="filter-chip active" data-filter="all">All</button>
                <button class="filter-chip" data-filter="sci-fi">Sci-Fi</button>
                <button class="filter-chip" data-filter="ya">YA</button>
                <button class="filter-chip" data-filter="article">Article</button>
                <button class="filter-chip" data-filter="poetry">Poetry</button>
                <button class="filter-chip" data-filter="essay">Essay</button>
                <button class="filter-chip" data-filter="guide">Guide</button>
            </div>
        </div>
        
        <div class="filter-group">
            <label class="filter-label">Theme</label>
            <div class="filter-buttons" id="theme-filters">
                <button class="filter-chip active" data-filter="all">All</button>
                <button class="filter-chip" data-filter="technology">Software Development</button>
                <button class="filter-chip" data-filter="writing">Writing</button>
                <button class="filter-chip" data-filter="post-apocalyptic">Post-Apocalyptic</button>
                <button class="filter-chip" data-filter="publishing">Publishing</button>
                <button class="filter-chip" data-filter="autobiographical">Autobiographical</button>
                
            </div>
        </div>
        
        <div class="filter-status">
            <span id="filter-count"></span>
            <button id="clear-filters" class="clear-btn">Clear All</button>
        </div>
    </div>
    
    <main class="toc-wrapper">
        <!-- rest of your table remains the same -->
    </main>
</div>
        
        <main class="toc-wrapper">
            <table class="toc-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Genres & Tags</th>
                    </tr>
                </thead>
                <tbody id="toc-body">
                    <tr data-genres='["sci-fi","ya"]' data-themes='[]'>
                        <td class="toc-date">May 20, 2026</td>
                        <td class="toc-title">
                            <a href="writing/shorts/threxil.html">The Threxil Pattern</a>
                        </td>
                        <td class="toc-tags">
                            <div class="pill-container">
                                <span class="pill">Sci-Fi</span>
                                <span class="pill">YA</span>
                            </div>
                        </td>
                    </tr>
                    <tr data-genres='["article"]' data-themes='["technology","writing","publishing"]'>
                        <td class="toc-date">June 4, 2026</td>
                        <td class="toc-title">
                            <a href="writing/articles/written-formatted.html">Written &amp; Formatted</a>
                        </td>
                        <td class="toc-tags">
                            <div class="pill-container">
                                <span class="pill">Article</span>
                                <span class="pill">Software Development</span>
                                <span class="pill">Writing</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; <span id="current-year-index"></span> Written by Tim Samoff.</p>
            <script>
                document.getElementById('current-year-index').textContent = new Date().getFullYear();
            </script>
        </div>
    </footer>

</body>
</html>
